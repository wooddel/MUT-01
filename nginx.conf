# ==============================================================================
# Security-Hardened Nginx Configuration
# Includes: Anti-Hacking Headers, Rate Limiting, DDoS Mitigation, & Asset Caching
# ==============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide server version tokens to prevent OS/version targeted attacks
    server_tokens off;

    # Logging Formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance & Connection Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate Limiting Zone to prevent DDoS & Brute-Force Hacking Attempts (10 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=anti_hack_limit:10m rate=10r/s;
    limit_req_status 429;

    # Gzip Compression for Fast Loading & Database/Static Caching
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 8080 default_server;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Rate Limit Enforcement for all incoming requests
        limit_req zone=anti_hack_limit burst=20 nodelay;

        # ==============================================================================
        # Security Headers (Protect against XSS, Clickjacking, MIME Sniffing, Injection)
        # ==============================================================================
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Main Web App Route
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache Static Assets (CSS, JS, WebP, PNG, JPG, Fonts)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Deny access to hidden files (.git, .env, .htaccess) for security
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
